[package]
name = "backend"
version = "1.0.0"
edition = "2024"
authors = ["Ty <ty@myriation.xyz>"]
license = "GPL-3.0-or-later"

[dependencies]
actix-web = { version = "4.11.0", features = ["http2"] }
anyhow = "1.0.98"
base16ct = { version = "0.2.0", features = ["std"] }
clap = { version = "4.5.41", features = ["derive", "env"] }
env_logger = "0.11.8"
moka = { version = "0.12.10", features = ["future"] }
# prometheus-client = "0.23.1"
quick-xml = { version = "0.38.0", features = ["serde", "serialize"] }
reqwest = { version = "0.12.22", default-features = false, features = ["charset", "http2", "system-proxy", "json", "rustls-tls"] }
semver = "1.0.26"
serde = "1.0.219"
serde_json = "1.0.141"
sha2 = "0.11.0-rc.0"
thiserror = "2.0.12"
tokio = { version = "1.46.1", features = ["macros", "rt-multi-thread"] }
url = { version = "2.5.4", features = ["serde"] }
